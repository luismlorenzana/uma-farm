name: Verify and deploy production

# Copied from uma-rpg's workflow. F1 holds the verify job only; the deploy job arrives in F2.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: uma-farm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # @luismlorenzana/* packages (uma-platform) on GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages
        run: pnpm lint

      - name: Run tests
        # One package at a time, as in uma-rpg: parallel Vitest suites starve the two-core runner (uma-rpg D256).
        run: pnpm test:ci

      - name: Build production artifacts
        run: pnpm build
